[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "japanese-pattern-assets-mcp"
version = "0.2.5"
description = "MCP server: AI agents can search Japanese pattern assets (tiles, game UI frames, printables) with license and AI-use info."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Spinix Tools" }]
dependencies = ["mcp>=2"]
keywords = ["mcp", "model-context-protocol", "assets", "japanese-pattern", "game-ui", "seamless"]

[project.scripts]
japanese-pattern-assets-mcp = "japanese_pattern_assets_mcp.server:main"

[project.urls]
Repository = "https://github.com/spinix-tools/japanese-pattern-assets-mcp"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
japanese_pattern_assets_mcp = ["catalog.json"]
